name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'   # Срабатывает только при пуше тега, например v1.0.0

permissions:
  contents: write  # Обязательно! Без этого не сможет создать релиз [citation:3][citation:6]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # --- Создаем GitHub Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Автоматически генерирует описание на основе коммитов [citation:13]
          generate_release_notes: true
          # Прикрепляем собранный фронтенд (папка dist) как zip-архив
          files: |
            frontend/dist/**