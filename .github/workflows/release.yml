name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'   # Запускается при пуше тега, например v0.0.2
  # Ручной запуск: Actions → Create Release → Run workflow (укажите тег)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.0.2'
        required: true

permissions:
  contents: write  # нужно для создания релиза

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Pack frontend build
        run: |
          cd frontend/dist
          zip -r ../../frontend-dist.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: frontend-dist.zip