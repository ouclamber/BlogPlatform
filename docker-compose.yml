version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blog_db
    environment:
      # Эти данные должны совпадать с тем, что в backend/.env
      POSTGRES_DB: blog2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog2"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blog_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Переопределяем хост, так как внутри Docker база называется "db"
      - DB_HOST=db

volumes:
  postgres_data: